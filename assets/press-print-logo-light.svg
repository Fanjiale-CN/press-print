<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Press Print logo — light</title>
  <desc id="desc">A large halftone circle containing an offset solid circle.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="5.2" fill="#0C0C0C"/>
    </pattern>
    <clipPath id="field">
      <rect x="56" y="56" width="912" height="912" rx="152"/>
    </clipPath>
  </defs>
  <rect x="56" y="56" width="912" height="912" rx="152" fill="#F4EFE7"/>
  <g clip-path="url(#field)">
    <circle cx="512" cy="500" r="280" fill="url(#dots)"/>
    <circle cx="603" cy="575" r="130" fill="#0C0C0C"/>
  </g>
</svg>
