<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{
      color-scheme:light dark;
      font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      --pp-text:#151515;
      --pp-muted:rgba(21,21,21,.64);
      --pp-faint:rgba(21,21,21,.46);
      --pp-border:rgba(21,21,21,.14);
      --pp-border-strong:rgba(21,21,21,.34);
      --pp-selected:rgba(12,12,12,.035);
      --pp-cta-bg:#0C0C0C;
      --pp-cta-fg:#F8F6F1;
    }
    *{box-sizing:border-box}
    body{margin:0;background:transparent;color:var(--pp-text);font:inherit}
    button,input{font:inherit;color:inherit}
    button:focus-visible,input:focus-visible{outline:2px solid currentColor;outline-offset:2px}
    .wrap{max-width:760px;padding:4px 0 2px}
    .top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}
    .summary{font-size:13px;line-height:1.5;color:var(--pp-muted);margin:0;max-width:62ch}
    .meta{font-size:10px;line-height:1.35;color:var(--pp-faint);white-space:nowrap;padding-top:2px}
    .version-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:14px 0 2px;padding:10px 0;border-top:1px solid var(--pp-border);border-bottom:1px solid var(--pp-border)}
    .versions{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
    .version{appearance:none;border:1px solid var(--pp-border);background:transparent;border-radius:999px;padding:6px 9px;min-height:30px;font-size:11px;line-height:1;cursor:pointer;transition:border-color .14s ease,background .14s ease,box-shadow .14s ease}
    .version:hover{border-color:var(--pp-border-strong)}
    .version[aria-pressed="true"]{border-color:currentColor;background:var(--pp-selected);font-weight:650;box-shadow:inset 0 0 0 1px currentColor}
    .baseline{display:flex;align-items:center;gap:8px;flex:0 0 auto}
    .preferred{font-size:10px;line-height:1.2;color:var(--pp-faint);white-space:nowrap}
    .use{appearance:none;border:0;background:transparent;padding:4px 0;font-size:11px;line-height:1.2;color:var(--pp-muted);font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-color:var(--pp-border-strong);text-underline-offset:3px}
    .use:hover:not(:disabled){color:var(--pp-text)}
    .use:disabled{cursor:default;text-decoration:none;color:var(--pp-faint);opacity:1}
    .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
    .action{appearance:none;border-radius:999px;padding:9px 14px;min-height:40px;font-size:12px;line-height:1;font-weight:650;cursor:pointer;transition:opacity .14s ease,transform .14s ease,border-color .14s ease}
    .action:hover:not(:disabled){opacity:.9}.action:active:not(:disabled){transform:translateY(1px)}
    .primary{border:1px solid var(--pp-cta-bg);background:var(--pp-cta-bg);color:var(--pp-cta-fg)}
    .secondary{border:1px solid var(--pp-border);background:transparent;color:var(--pp-text)}
    .secondary:hover:not(:disabled){border-color:var(--pp-border-strong)}
    .action:disabled,.version:disabled,.chip:disabled,.send:disabled{opacity:.42;cursor:default}
    .refine{margin-top:14px;padding-top:14px;border-top:1px solid var(--pp-border)}
    .refine[hidden]{display:none}
    .refine-label{font-size:12px;font-weight:650;line-height:1.3;margin:0 0 9px}
    .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
    .chip{appearance:none;border:1px solid var(--pp-border);background:transparent;border-radius:999px;padding:6px 9px;min-height:30px;font-size:11px;line-height:1.2;color:var(--pp-muted);cursor:pointer}
    .chip:hover{border-color:var(--pp-border-strong);color:var(--pp-text)}
    .row{display:flex;gap:8px;align-items:center}
    .text{flex:1;min-width:0;min-height:40px;border:1px solid var(--pp-border);background:transparent;border-radius:11px;padding:9px 11px;font-size:12px;line-height:1.4;outline:none}
    .text:hover{border-color:var(--pp-border-strong)}
    .text:focus{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
    .send{appearance:none;border:1px solid var(--pp-cta-bg);background:var(--pp-cta-bg);color:var(--pp-cta-fg);border-radius:999px;padding:9px 13px;min-height:40px;font-size:12px;line-height:1;font-weight:650;cursor:pointer}
    .status{font-size:11px;line-height:1.35;color:var(--pp-faint);margin-top:8px;min-height:15px}
    html[data-theme="dark"]{
      --pp-text:#F1EEE8;
      --pp-muted:rgba(241,238,232,.66);
      --pp-faint:rgba(241,238,232,.46);
      --pp-border:rgba(241,238,232,.15);
      --pp-border-strong:rgba(241,238,232,.36);
      --pp-selected:rgba(244,239,231,.05);
      --pp-cta-bg:#F4EFE7;
      --pp-cta-fg:#0C0C0C;
    }
    @media(prefers-color-scheme:dark){
      html:not([data-theme]){
        --pp-text:#F1EEE8;
        --pp-muted:rgba(241,238,232,.66);
        --pp-faint:rgba(241,238,232,.46);
        --pp-border:rgba(241,238,232,.15);
        --pp-border-strong:rgba(241,238,232,.36);
        --pp-selected:rgba(244,239,231,.05);
        --pp-cta-bg:#F4EFE7;
        --pp-cta-fg:#0C0C0C;
      }
    }
    @media(max-width:620px){
      .wrap{padding-top:2px}.top{display:block}.meta{margin-top:5px}.version-row{align-items:flex-start}.action,.send{min-height:44px}
    }
    @media(max-width:420px){
      .version-row{display:block}.baseline{margin-top:9px;justify-content:space-between}.actions{display:grid;grid-template-columns:1fr 1fr}.action{width:100%}.row{align-items:stretch}.send{padding-inline:14px}
    }
    @media(max-width:340px){.actions{grid-template-columns:1fr}.row{flex-direction:column}.send{width:100%}}
    @media(prefers-reduced-motion:reduce){.version,.action{transition:none}}
  </style>
</head>
<body>
  <main class="wrap" data-press-print-widget="result-card">
    <div class="top">
      <p id="summary" class="summary"></p>
      <div id="meta" class="meta"></div>
    </div>

    <div id="versionRow" class="version-row">
      <div id="versions" class="versions"></div>
      <div class="baseline">
        <span id="preferred" class="preferred"></span>
        <button id="useBtn" class="use" type="button">Use This</button>
      </div>
    </div>

    <div class="actions">
      <button id="refineBtn" class="action primary" type="button">Refine</button>
      <button id="anotherBtn" class="action secondary" type="button">Try Another</button>
    </div>

    <section id="refine" class="refine" hidden>
      <div class="refine-label">What should change?</div>
      <div id="chips" class="chips"></div>
      <div class="row">
        <input id="instruction" class="text" type="text" placeholder="Tell Press Print what to change…" />
        <button id="send" class="send" type="button">Apply</button>
      </div>
    </section>
    <div id="status" class="status" aria-live="polite"></div>
  </main>

  <script>
    (()=>{
      let data=window.openai?.toolOutput||{};
      const saved=window.openai?.widgetState||{};
      let activeVersion=typeof saved.activeVersion==="string"?saved.activeVersion:null;
      let preferredVersionId=typeof saved.preferredVersionId==="string"?saved.preferredVersionId:null;
      let lastResultVersionId=typeof data.versionId==="string"?data.versionId:null;
      let hasToolOutput=Boolean(data?.kind);
      const $=(id)=>document.getElementById(id);
      const defaultChips=["Make it flatter","Less texture","More abstract","Keep more of original"];

      function applyTheme(){const t=window.openai?.theme;if(t==="light"||t==="dark"){document.documentElement.style.colorScheme=t;document.documentElement.dataset.theme=t}}
      function versions(){return Array.isArray(data.versions)?data.versions:[]}
      function ids(){return new Set(versions().map(v=>v.id))}
      function normalizeSelection(preferNewest=false){
        const known=ids();
        if(preferNewest&&data.versionId&&known.has(data.versionId))activeVersion=data.versionId;
        if(!activeVersion||!known.has(activeVersion))activeVersion=(data.versionId&&known.has(data.versionId)?data.versionId:null)||versions().find(v=>v.active)?.id||versions()[0]?.id||data.versionId||null;
        const declared=data.preferredVersionId||versions().find(v=>v.preferred)?.id||null;
        if(declared&&known.has(declared))preferredVersionId=declared;
        else if(preferredVersionId&&!known.has(preferredVersionId))preferredVersionId=null;
      }
      function current(){return versions().find(v=>v.id===activeVersion)||versions().find(v=>v.id===data.versionId)||versions()[0]||(data.versionId?{id:data.versionId}:null)}
      async function save(extra={}){if(!window.openai?.setWidgetState)return;try{await window.openai.setWidgetState({activeVersion,preferredVersionId,...extra})}catch(e){console.warn(e)}}
      function setBusy(busy){
        document.querySelectorAll("button").forEach((b)=>{b.disabled=busy});
        $("instruction").disabled=busy;
        if(!busy)renderMeta();
      }
      async function follow(prompt,label,unlockAfter=false){
        $("status").textContent=label||"Continuing…";setBusy(true);
        try{
          if(!window.openai?.sendFollowUpMessage)throw new Error("Host messaging unavailable");
          await window.openai.sendFollowUpMessage({prompt,scrollToBottom:true});
          $("status").textContent="Sent";
          if(unlockAfter)setBusy(false);
        }catch(e){setBusy(false);$("status").textContent="Couldn’t continue. Use chat instead.";console.error(e)}
      }
      function versionContext(v){
        if(!v)return"the current Press Print result";
        const bits=[`version ${v.label||v.id} (id ${v.id})`];
        if(v.direction)bits.push(`direction ${v.direction}`);
        if(Number.isFinite(v.structure))bits.push(`Structure ${v.structure}/100`);
        if(Number.isFinite(v.intensity))bits.push(`Intensity ${v.intensity}/100`);
        if(v.direction==="custom"&&v.customDirection)bits.push(`custom direction “${v.customDirection}”`);
        if(v.direction==="typography"&&v.typographyMode)bits.push(`Typography mode ${v.typographyMode}${v.typographyText?` with text/brief “${v.typographyText}”`:""}`);
        return `Press Print ${bits.join(", ")}`;
      }
      function inheritedControlInstruction(v){
        if(!v)return"Use the most recent known creation controls.";
        const parts=[];
        if(v.direction)parts.push(`defaultDirection=${v.direction}`);
        if(Number.isFinite(v.structure))parts.push(`structureDefault=${v.structure}`);
        if(Number.isFinite(v.intensity))parts.push(`intensityDefault=${v.intensity}`);
        if(v.direction==="custom"&&v.customDirection)parts.push(`initialCustomDirection=${JSON.stringify(v.customDirection)}`);
        if(v.direction==="typography"&&v.typographyMode)parts.push(`initialTypographyMode=${v.typographyMode}`);
        if(v.direction==="typography"&&typeof v.typographyText==="string")parts.push(`initialTypographyText=${JSON.stringify(v.typographyText)}`);
        return parts.length?`Prefill the creation card with ${parts.join(", ")}.`:"Use the most recent known creation controls.";
      }
      function renderVersions(){
        const box=$("versions");box.innerHTML="";const items=versions();
        $("versionRow").style.display=items.length||data.versionId?"flex":"none";
        box.style.display=items.length>1?"flex":"none";
        items.forEach((v,i)=>{
          const b=document.createElement("button");b.type="button";b.className="version";b.textContent=v.label||`V${i+1}`;b.setAttribute("aria-pressed",String(v.id===activeVersion));b.setAttribute("aria-label",`View ${v.label||`version ${i+1}`}`);
          b.onclick=()=>{activeVersion=v.id;renderVersions();renderMeta();save()};box.appendChild(b);
        });
      }
      function renderMeta(){
        const v=current();
        $("meta").textContent=v?`${v.label||v.id}${v.direction?` · ${String(v.direction).replaceAll("-"," ")}`:""}`:"";
        const preferred=preferredVersionId?versions().find(x=>x.id===preferredVersionId):null;
        const isBaseline=Boolean(v?.id&&preferredVersionId===v.id);
        $("preferred").textContent=!isBaseline&&preferredVersionId?`Baseline: ${preferred?.label||preferredVersionId}`:"";
        $("useBtn").textContent=isBaseline?"Baseline":"Use This";
        $("useBtn").disabled=!v?.id||isBaseline;
        $("useBtn").setAttribute("aria-pressed",String(isBaseline));
      }
      function renderChips(){
        const box=$("chips");box.innerHTML="";
        (Array.isArray(data.quickRefinements)&&data.quickRefinements.length?data.quickRefinements:defaultChips).slice(0,4).forEach(text=>{
          const b=document.createElement("button");b.type="button";b.className="chip";b.textContent=text;b.onclick=()=>{$("instruction").value=text;$("instruction").focus()};box.appendChild(b);
        });
      }
      function render(next,{preferNewest=false}={}){
        data=next||{};applyTheme();normalizeSelection(preferNewest);
        $("summary").textContent=data.resultSummary||"Keep what works. Change only what needs changing.";
        renderVersions();renderMeta();renderChips();$("status").textContent="";
      }

      $("refineBtn").onclick=()=>{$("refine").hidden=!$("refine").hidden;if(!$("refine").hidden)$("instruction").focus()};
      $("send").onclick=async()=>{
        const text=$("instruction").value.trim();if(!text){$("status").textContent="Describe one change first.";return}
        const v=current();await save({lastAction:"refine",lastRefine:text});
        const lineage=v?.id?`Create a new child revision with parentId ${v.id} and kind revision. Do not overwrite version ${v.id}.`:"Create a new revision without overwriting the current result.";
        const inheritance=v?`Inherit its direction, Structure, Intensity, special-mode state, hard locks, successful crop, hierarchy, identity, and other successful decisions unless this instruction explicitly requires changing one of them.`:"Preserve all successful state that is not implicated by the instruction.";
        await follow(`Refine ${versionContext(v)}. User instruction: ${text}. ${lineage} ${inheritance} Change only the requested or clearly necessary axis. Generate the revision now, then show result controls with complete lineage metadata.`);
      };
      $("instruction").addEventListener("keydown",e=>{if(e.key==="Enter")$("send").click()});
      $("anotherBtn").onclick=async()=>{
        const v=current();await save({lastAction:"try-another"});
        const seed=v?.id?`Set creationKind=alternative and seedVersionId=${v.id}.`:"Set creationKind=alternative.";
        await follow(`Open the Press Print creation card for a new alternative from the same original source image. ${seed} ${inheritedControlInstruction(v)} The seed version supplies control values only. Do not use the seed result image as visual input, do not overwrite it, and do not treat the alternative as a child revision. Let the user adjust Direction, Structure, Intensity, and any active special-mode fields before Generate.`);
      };
      $("useBtn").onclick=async()=>{
        const v=current();if(!v?.id)return;
        preferredVersionId=v.id;renderMeta();await save({lastAction:"use-this"});
        await follow(`Mark Press Print version ${v.id} as the user's preferred active baseline. Do not generate a new image, do not create a new version, and do not alter any pixels. Future refinements should default to this version unless the user selects another version or explicitly returns to the original source.`,"Using this version…",true);
      };

      normalizeSelection(false);render(data);
      window.addEventListener("openai:set_globals",event=>{
        const g=event?.detail?.globals||{};
        if(g.toolOutput){
          const nextId=typeof g.toolOutput.versionId==="string"?g.toolOutput.versionId:null;
          const preferNewest=Boolean(hasToolOutput&&nextId&&nextId!==lastResultVersionId);
          hasToolOutput=true;lastResultVersionId=nextId;render(g.toolOutput,{preferNewest});
        }
        if(g.theme)applyTheme();
      });
    })();
  </script>
</body>
</html>
