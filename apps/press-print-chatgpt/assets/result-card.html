<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{color-scheme:light dark;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;background:transparent;color:var(--pp-text,#151515)}
    .wrap{max-width:760px;padding:2px 0}.top{display:flex;justify-content:space-between;gap:12px;align-items:start}.summary{font-size:13px;line-height:1.45;opacity:.82;margin:0}.meta{font-size:11px;opacity:.52;white-space:nowrap}.versions{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.version{appearance:none;border:1px solid var(--pp-border,rgba(0,0,0,.14));background:transparent;color:inherit;border-radius:999px;padding:5px 9px;font-size:11px;cursor:pointer}.version[aria-pressed="true"]{border-color:var(--pp-text,#151515);font-weight:650}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.action{appearance:none;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer}.action:disabled,.version:disabled,.chip:disabled,.send:disabled{opacity:.42;cursor:default}.primary{border:1px solid var(--pp-text,#151515);background:var(--pp-text,#151515);color:var(--pp-bg,#fff)}.secondary{border:1px solid var(--pp-border,rgba(0,0,0,.14));background:transparent;color:inherit}.preferred{font-size:11px;opacity:.55;margin-top:7px}.refine{margin-top:12px;border-left:2px solid var(--pp-border,rgba(0,0,0,.12));padding-left:10px}.refine[hidden]{display:none}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.chip{appearance:none;border:1px solid var(--pp-border,rgba(0,0,0,.14));background:transparent;color:inherit;border-radius:999px;padding:6px 9px;font-size:11px;cursor:pointer}.row{display:flex;gap:7px}.text{flex:1;min-width:0;border:1px solid var(--pp-border,rgba(0,0,0,.14));background:transparent;color:inherit;border-radius:10px;padding:9px 10px;font:inherit;font-size:12px}.send{appearance:none;border:1px solid var(--pp-text,#151515);background:var(--pp-text,#151515);color:var(--pp-bg,#fff);border-radius:999px;padding:8px 11px;font-size:12px;font-weight:650;cursor:pointer}.status{font-size:11px;opacity:.52;margin-top:7px;min-height:15px}
    @media(max-width:620px){.top{display:block}.meta{margin-top:4px}}
    @media(prefers-color-scheme:dark){body{--pp-text:#f1eee8;--pp-bg:#151515;--pp-border:rgba(255,255,255,.15)}}
  </style>
</head>
<body>
  <main class="wrap" data-press-print-widget="result-card">
    <div class="top"><p id="summary" class="summary"></p><div id="meta" class="meta"></div></div>
    <div id="versions" class="versions"></div>
    <div class="actions">
      <button id="refineBtn" class="action primary" type="button">Refine</button>
      <button id="anotherBtn" class="action secondary" type="button">Try Another</button>
      <button id="useBtn" class="action secondary" type="button">Use This</button>
    </div>
    <div id="preferred" class="preferred"></div>
    <section id="refine" class="refine" hidden>
      <div id="chips" class="chips"></div>
      <div class="row"><input id="instruction" class="text" type="text" placeholder="Tell Press Print what to change…" /><button id="send" class="send" type="button">Apply</button></div>
    </section>
    <div id="status" class="status" aria-live="polite"></div>
  </main>

  <script>
    (()=>{
      let data=window.openai?.toolOutput||{};
      const saved=window.openai?.widgetState||{};
      let activeVersion=typeof saved.activeVersion==="string"?saved.activeVersion:null;
      let preferredVersionId=typeof saved.preferredVersionId==="string"?saved.preferredVersionId:null;
      let lastResultVersionId=typeof data.versionId==="string"?data.versionId:null;
      let hasToolOutput=Boolean(data?.kind);
      const $=(id)=>document.getElementById(id);
      const defaultChips=["Make it flatter","Less texture","More abstract","Keep more of original"];

      function applyTheme(){const t=window.openai?.theme;if(t==="light"||t==="dark")document.documentElement.style.colorScheme=t}
      function versions(){return Array.isArray(data.versions)?data.versions:[]}
      function ids(){return new Set(versions().map(v=>v.id))}
      function normalizeSelection(preferNewest=false){
        const known=ids();
        if(preferNewest&&data.versionId&&known.has(data.versionId))activeVersion=data.versionId;
        if(!activeVersion||!known.has(activeVersion))activeVersion=(data.versionId&&known.has(data.versionId)?data.versionId:null)||versions().find(v=>v.active)?.id||versions()[0]?.id||data.versionId||null;
        const declared=data.preferredVersionId||versions().find(v=>v.preferred)?.id||null;
        if(declared&&known.has(declared))preferredVersionId=declared;
        else if(preferredVersionId&&!known.has(preferredVersionId))preferredVersionId=null;
      }
      function current(){return versions().find(v=>v.id===activeVersion)||versions().find(v=>v.id===data.versionId)||versions()[0]||(data.versionId?{id:data.versionId}:null)}
      async function save(extra={}){if(!window.openai?.setWidgetState)return;try{await window.openai.setWidgetState({activeVersion,preferredVersionId,...extra})}catch(e){console.warn(e)}}
      function setBusy(busy){document.querySelectorAll("button").forEach((b)=>{b.disabled=busy});$("instruction").disabled=busy}
      async function follow(prompt,label,unlockAfter=false){
        $("status").textContent=label||"Continuing…";setBusy(true);
        try{
          if(!window.openai?.sendFollowUpMessage)throw new Error("Host messaging unavailable");
          await window.openai.sendFollowUpMessage({prompt,scrollToBottom:true});
          $("status").textContent="Sent";
          if(unlockAfter)setBusy(false);
        }catch(e){setBusy(false);$("status").textContent="Couldn’t continue. Use chat instead.";console.error(e)}
      }
      function versionContext(v){
        if(!v)return"the current Press Print result";
        const bits=[`version ${v.label||v.id} (id ${v.id})`];
        if(v.direction)bits.push(`direction ${v.direction}`);
        if(Number.isFinite(v.structure))bits.push(`Structure ${v.structure}/100`);
        if(Number.isFinite(v.intensity))bits.push(`Intensity ${v.intensity}/100`);
        if(v.direction==="custom"&&v.customDirection)bits.push(`custom direction “${v.customDirection}”`);
        if(v.direction==="typography"&&v.typographyMode)bits.push(`Typography mode ${v.typographyMode}${v.typographyText?` with text/brief “${v.typographyText}”`:""}`);
        return `Press Print ${bits.join(", ")}`;
      }
      function inheritedControlInstruction(v){
        if(!v)return"Use the most recent known creation controls.";
        const parts=[];
        if(v.direction)parts.push(`defaultDirection=${v.direction}`);
        if(Number.isFinite(v.structure))parts.push(`structureDefault=${v.structure}`);
        if(Number.isFinite(v.intensity))parts.push(`intensityDefault=${v.intensity}`);
        if(v.direction==="custom"&&v.customDirection)parts.push(`initialCustomDirection=${JSON.stringify(v.customDirection)}`);
        if(v.direction==="typography"&&v.typographyMode)parts.push(`initialTypographyMode=${v.typographyMode}`);
        if(v.direction==="typography"&&typeof v.typographyText==="string")parts.push(`initialTypographyText=${JSON.stringify(v.typographyText)}`);
        return parts.length?`Prefill the creation card with ${parts.join(", ")}.`:"Use the most recent known creation controls.";
      }
      function renderVersions(){
        const box=$("versions");box.innerHTML="";const items=versions();box.style.display=items.length>1?"flex":"none";
        items.forEach((v,i)=>{
          const b=document.createElement("button");b.type="button";b.className="version";b.textContent=v.label||`V${i+1}`;b.setAttribute("aria-pressed",String(v.id===activeVersion));
          b.onclick=()=>{activeVersion=v.id;renderVersions();renderMeta();save()};box.appendChild(b);
        });
      }
      function renderMeta(){
        const v=current();
        $("meta").textContent=v?`${v.label||v.id}${v.direction?` · ${v.direction}`:""}`:"";
        $("preferred").textContent=v&&preferredVersionId===v.id?"Current baseline":preferredVersionId?`Baseline: ${versions().find(x=>x.id===preferredVersionId)?.label||preferredVersionId}`:"";
        $("useBtn").disabled=!v?.id;
      }
      function renderChips(){
        const box=$("chips");box.innerHTML="";
        (Array.isArray(data.quickRefinements)&&data.quickRefinements.length?data.quickRefinements:defaultChips).slice(0,4).forEach(text=>{
          const b=document.createElement("button");b.type="button";b.className="chip";b.textContent=text;b.onclick=()=>{$("instruction").value=text;$("instruction").focus()};box.appendChild(b);
        });
      }
      function render(next,{preferNewest=false}={}){
        data=next||{};applyTheme();normalizeSelection(preferNewest);
        $("summary").textContent=data.resultSummary||"Keep what works. Change only what needs changing.";
        renderVersions();renderMeta();renderChips();$("status").textContent="";
      }

      $("refineBtn").onclick=()=>{$("refine").hidden=!$("refine").hidden;if(!$("refine").hidden)$("instruction").focus()};
      $("send").onclick=async()=>{
        const text=$("instruction").value.trim();if(!text){$("status").textContent="Describe one change first.";return}
        const v=current();await save({lastAction:"refine",lastRefine:text});
        const lineage=v?.id?`Create a new child revision with parentId ${v.id} and kind revision. Do not overwrite version ${v.id}.`:"Create a new revision without overwriting the current result.";
        const inheritance=v?`Inherit its direction, Structure, Intensity, special-mode state, hard locks, successful crop, hierarchy, identity, and other successful decisions unless this instruction explicitly requires changing one of them.`:"Preserve all successful state that is not implicated by the instruction.";
        await follow(`Refine ${versionContext(v)}. User instruction: ${text}. ${lineage} ${inheritance} Change only the requested or clearly necessary axis. Generate the revision now, then show result controls with complete lineage metadata.`);
      };
      $("instruction").addEventListener("keydown",e=>{if(e.key==="Enter")$("send").click()});
      $("anotherBtn").onclick=async()=>{
        const v=current();await save({lastAction:"try-another"});
        const seed=v?.id?`Set creationKind=alternative and seedVersionId=${v.id}.`:"Set creationKind=alternative.";
        await follow(`Open the Press Print creation card for a new alternative from the same original source image. ${seed} ${inheritedControlInstruction(v)} The seed version supplies control values only. Do not use the seed result image as visual input, do not overwrite it, and do not treat the alternative as a child revision. Let the user adjust Direction, Structure, Intensity, and any active special-mode fields before Generate.`);
      };
      $("useBtn").onclick=async()=>{
        const v=current();if(!v?.id)return;
        preferredVersionId=v.id;renderMeta();await save({lastAction:"use-this"});
        await follow(`Mark Press Print version ${v.id} as the user's preferred active baseline. Do not generate a new image, do not create a new version, and do not alter any pixels. Future refinements should default to this version unless the user selects another version or explicitly returns to the original source.`,"Using this version…",true);
      };

      normalizeSelection(false);render(data);
      window.addEventListener("openai:set_globals",event=>{
        const g=event?.detail?.globals||{};
        if(g.toolOutput){
          const nextId=typeof g.toolOutput.versionId==="string"?g.toolOutput.versionId:null;
          const preferNewest=Boolean(hasToolOutput&&nextId&&nextId!==lastResultVersionId);
          hasToolOutput=true;lastResultVersionId=nextId;render(g.toolOutput,{preferNewest});
        }
        if(g.theme)applyTheme();
      });
    })();
  </script>
</body>
</html>
