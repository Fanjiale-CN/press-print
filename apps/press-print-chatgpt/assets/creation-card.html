<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{
      color-scheme:light dark;
      font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      --pp-text:#151515;
      --pp-muted:rgba(21,21,21,.64);
      --pp-faint:rgba(21,21,21,.46);
      --pp-border:rgba(21,21,21,.14);
      --pp-border-strong:rgba(21,21,21,.34);
      --pp-selected:rgba(12,12,12,.035);
      --pp-cta-bg:#0C0C0C;
      --pp-cta-fg:#F8F6F1;
      --pp-suggest:#716B62;
    }
    *{box-sizing:border-box}
    body{margin:0;background:transparent;color:var(--pp-text);font:inherit}
    button,input,summary{font:inherit}
    button,input{color:inherit}
    button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid currentColor;outline-offset:2px}
    .wrap{max-width:760px;padding:4px 0 2px}
    .source{font-size:12px;line-height:1.5;color:var(--pp-muted);margin:0 0 18px;max-width:68ch}
    .section{margin:0 0 20px}
    .label{font-size:12px;font-weight:650;line-height:1.3;margin:0 0 8px}
    .directions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .direction{position:relative;appearance:none;border:1px solid var(--pp-border);background:transparent;border-radius:12px;padding:10px 11px;text-align:left;cursor:pointer;font-size:12px;line-height:1.25;min-height:42px;transition:border-color .14s ease,background .14s ease,box-shadow .14s ease}
    .direction:hover{border-color:var(--pp-border-strong)}
    .direction[aria-pressed="true"]{border-color:currentColor;background:var(--pp-selected);font-weight:650;box-shadow:inset 0 0 0 1px currentColor}
    .recommended::after{content:"Suggested";display:block;margin-top:3px;font-size:10px;line-height:1;color:var(--pp-suggest);font-weight:500}
    .control{margin:0 0 19px}
    .control-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:7px}
    .control-head .label{margin:0}
    .value{font-size:10px;line-height:1;color:var(--pp-faint)}
    .range{display:block;width:100%;margin:0;accent-color:var(--pp-cta-bg)}
    .ends{display:flex;justify-content:space-between;font-size:10px;line-height:1.3;color:var(--pp-faint);margin-top:5px}
    .special{border-left:2px solid var(--pp-border);padding:1px 0 1px 12px;margin:-2px 0 20px}
    .special[hidden],.text[hidden]{display:none}
    .row{display:flex;flex-wrap:wrap;gap:8px 12px;margin-bottom:10px}
    .choice{font-size:11px;line-height:1.3;display:flex;gap:6px;align-items:center;color:var(--pp-muted);min-height:24px}
    .choice input{margin:0;accent-color:var(--pp-cta-bg)}
    .text{width:100%;min-height:40px;border:1px solid var(--pp-border);background:transparent;border-radius:11px;padding:9px 11px;font-size:12px;line-height:1.4;outline:none}
    .text:hover{border-color:var(--pp-border-strong)}
    .text:focus{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
    .validation{font-size:11px;line-height:1.35;color:var(--pp-muted);margin-top:6px;min-height:15px}
    .advanced{font-size:11px;margin:2px 0 16px;padding-top:12px;border-top:1px solid var(--pp-border)}
    .advanced summary{width:max-content;cursor:pointer;color:var(--pp-muted);font-weight:550}
    .advanced-grid{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:10px}
    .footer{padding-top:14px;border-top:1px solid var(--pp-border)}
    .actions{display:flex;align-items:center;gap:10px}
    .generate{appearance:none;border:1px solid var(--pp-cta-bg);background:var(--pp-cta-bg);color:var(--pp-cta-fg);border-radius:999px;padding:9px 16px;min-height:40px;font-size:12px;font-weight:650;cursor:pointer;transition:opacity .14s ease,transform .14s ease}
    .generate:hover:not(:disabled){opacity:.9}
    .generate:active:not(:disabled){transform:translateY(1px)}
    .generate:disabled{opacity:.42;cursor:default}
    .status{font-size:11px;line-height:1.3;color:var(--pp-faint)}
    .note{font-size:10px;line-height:1.4;color:var(--pp-faint);margin-top:8px}
    html[data-theme="dark"]{
      --pp-text:#F1EEE8;
      --pp-muted:rgba(241,238,232,.66);
      --pp-faint:rgba(241,238,232,.46);
      --pp-border:rgba(241,238,232,.15);
      --pp-border-strong:rgba(241,238,232,.36);
      --pp-selected:rgba(244,239,231,.05);
      --pp-cta-bg:#F4EFE7;
      --pp-cta-fg:#0C0C0C;
      --pp-suggest:#CBC4B8;
    }
    @media(prefers-color-scheme:dark){
      html:not([data-theme]){
        --pp-text:#F1EEE8;
        --pp-muted:rgba(241,238,232,.66);
        --pp-faint:rgba(241,238,232,.46);
        --pp-border:rgba(241,238,232,.15);
        --pp-border-strong:rgba(241,238,232,.36);
        --pp-selected:rgba(244,239,231,.05);
        --pp-cta-bg:#F4EFE7;
        --pp-cta-fg:#0C0C0C;
        --pp-suggest:#CBC4B8;
      }
    }
    @media(max-width:620px){
      .wrap{padding-top:2px}.source{margin-bottom:16px}.directions{grid-template-columns:repeat(2,minmax(0,1fr))}.direction{min-height:44px}.generate{min-height:44px;padding-inline:18px}
    }
    @media(max-width:390px){.directions{grid-template-columns:1fr}.actions{align-items:flex-start;flex-direction:column}.generate{width:100%}}
    @media(prefers-reduced-motion:reduce){.direction,.generate{transition:none}}
  </style>
</head>
<body>
  <main class="wrap" data-press-print-widget="creation-card">
    <p id="source" class="source"></p>

    <section class="section">
      <div class="label">Direction</div>
      <div id="directions" class="directions"></div>
    </section>

    <section class="control">
      <div class="control-head"><div class="label">Structure</div><span id="structureValue" class="value"></span></div>
      <input id="structure" class="range" type="range" min="0" max="100" step="1" aria-label="Structure from Original to Rebuild" />
      <div class="ends"><span>Original</span><span>Rebuild</span></div>
    </section>

    <section class="control">
      <div class="control-head"><div class="label">Intensity</div><span id="intensityValue" class="value"></span></div>
      <input id="intensity" class="range" type="range" min="0" max="100" step="1" aria-label="Intensity from Soft to Strong" />
      <div class="ends"><span>Soft</span><span>Strong</span></div>
    </section>

    <section id="typography" class="special" hidden>
      <div class="label">Typography</div>
      <div class="row" role="radiogroup" aria-label="Typography mode">
        <label class="choice"><input type="radio" name="textMode" value="keep" />Keep original text</label>
        <label class="choice"><input type="radio" name="textMode" value="replace" />Replace text</label>
        <label class="choice"><input type="radio" name="textMode" value="generate" />Generate text</label>
      </div>
      <input id="headline" class="text" type="text" hidden />
      <div id="typeValidation" class="validation" aria-live="polite"></div>
    </section>

    <section id="custom" class="special" hidden>
      <div class="label">Custom direction</div>
      <input id="customDirection" class="text" type="text" placeholder="Describe the direction…" />
      <div id="customValidation" class="validation" aria-live="polite"></div>
    </section>

    <details id="advanced" class="advanced">
      <summary>More Controls</summary>
      <div class="advanced-grid">
        <label class="choice"><input id="preserveSubject" type="checkbox" />Preserve subject / face</label>
        <label class="choice"><input id="preserveColors" type="checkbox" />Preserve source colors</label>
        <label class="choice"><input id="preserveText" type="checkbox" />Preserve source text</label>
      </div>
    </details>

    <div class="footer">
      <div class="actions">
        <button id="generate" class="generate" type="button">Generate</button>
        <span id="status" class="status" aria-live="polite"></span>
      </div>
      <div class="note">Fine-tune the result in normal language after generation.</div>
    </div>
  </main>

  <script>
    (()=>{
      const directions=[
        ["editorial-print","Editorial Print"],
        ["flat-graphic","Flat Graphic"],
        ["collage","Collage"],
        ["typography","Typography"],
        ["restore","Restore"],
        ["custom","Custom"],
      ];
      const directionIds=new Set(directions.map(([id])=>id));
      const $=(id)=>document.getElementById(id);
      let data=window.openai?.toolOutput||{};
      let hasToolOutput=Boolean(data?.kind);
      let userTouched=false;

      function bounded(value,fallback){const n=Number(value);return Number.isFinite(n)?Math.max(0,Math.min(100,Math.round(n))):fallback}
      function validDirection(value){return directionIds.has(value)?value:null}
      function validTextMode(value){return ["keep","replace","generate"].includes(value)?value:null}
      function buildInitialState(){
        const saved=window.openai?.widgetState||{};
        return {
          direction:validDirection(saved.direction)||validDirection(data.recommendedDirection)||validDirection(data.defaultDirection)||"editorial-print",
          structure:bounded(saved.structure,bounded(data.structureDefault,58)),
          intensity:bounded(saved.intensity,bounded(data.intensityDefault,58)),
          textMode:validTextMode(saved.textMode)||validTextMode(data.initialTypographyMode)||"keep",
          headline:typeof saved.headline==="string"?saved.headline:(data.initialTypographyText||""),
          customDirection:typeof saved.customDirection==="string"?saved.customDirection:(data.initialCustomDirection||""),
          preserveSubject:Boolean(saved.preserveSubject),
          preserveColors:Boolean(saved.preserveColors),
          preserveText:Boolean(saved.preserveText),
        };
      }
      let state=buildInitialState();

      function applyTheme(){const t=window.openai?.theme;if(t==="light"||t==="dark"){document.documentElement.style.colorScheme=t;document.documentElement.dataset.theme=t}}
      function valueLabel(n){if(n<=25)return "Low";if(n<=55)return "Medium";if(n<=80)return "High";return "Max"}
      function activeAdvanced(){
        return {
          preserveSubject:state.preserveSubject,
          preserveColors:state.preserveColors,
          preserveText:state.direction==="typography"&&state.textMode!=="keep"?false:state.preserveText,
        };
      }

      async function save(){
        if(!window.openai?.setWidgetState)return;
        try{await window.openai.setWidgetState({...state})}catch(e){console.warn(e)}
      }

      function touch(){userTouched=true}

      function renderDirections(){
        const box=$("directions");box.innerHTML="";
        directions.forEach(([id,label])=>{
          const b=document.createElement("button");b.type="button";b.className="direction";b.textContent=label;b.dataset.id=id;
          if(data.recommendedDirection===id)b.classList.add("recommended");
          b.setAttribute("aria-pressed",String(state.direction===id));
          b.onclick=()=>{touch();state.direction=id;renderDirections();renderSpecial();validate();save()};
          box.appendChild(b);
        });
      }

      function renderSpecial(){
        const isTypography=state.direction==="typography";
        $("typography").hidden=!isTypography;
        $("custom").hidden=state.direction!=="custom";
        document.querySelectorAll('input[name="textMode"]').forEach((el)=>{el.checked=el.value===state.textMode});
        $("headline").value=state.headline;
        $("customDirection").value=state.customDirection;
        const showTextField=isTypography&&state.textMode!=="keep";
        $("headline").hidden=!showTextField;
        $("headline").placeholder=state.textMode==="replace"?"Exact replacement text":"Headline or brief (optional)";
        const textConflict=isTypography&&state.textMode!=="keep";
        $("preserveText").disabled=textConflict;
        if(textConflict)state.preserveText=false;
        $("preserveSubject").checked=state.preserveSubject;
        $("preserveColors").checked=state.preserveColors;
        $("preserveText").checked=state.preserveText;
      }

      function renderValues(){
        $("structure").value=String(state.structure);$("intensity").value=String(state.intensity);
        $("structureValue").textContent=valueLabel(state.structure);$("intensityValue").textContent=valueLabel(state.intensity);
      }

      function validate(){
        $("typeValidation").textContent="";$("customValidation").textContent="";
        if(state.direction==="custom"&&!state.customDirection.trim()){$("customValidation").textContent="Describe the direction first.";return false}
        if(state.direction==="typography"&&state.textMode==="replace"&&!state.headline.trim()){$("typeValidation").textContent="Enter the exact replacement text.";return false}
        return true;
      }

      function buildPrompt(){
        const name=directions.find(([id])=>id===state.direction)?.[1]||state.direction;
        const extras=[];const a=activeAdvanced();
        if(a.preserveSubject)extras.push("preserve the subject/face");
        if(a.preserveColors)extras.push("preserve the source colors");
        if(a.preserveText)extras.push("preserve important source text exactly when feasible");
        if(Array.isArray(data.hardLocks))extras.push(...data.hardLocks);
        let special="";
        if(state.direction==="custom")special=` Custom direction: ${state.customDirection.trim()}.`;
        if(state.direction==="typography"){
          const text=state.headline.trim();
          if(state.textMode==="keep")special=" Typography mode: keep original source text selectively and do not invent new copy.";
          if(state.textMode==="replace")special=` Typography mode: replace text using only this exact wording: “${text}”. Do not add companion copy.`;
          if(state.textMode==="generate")special=` Typography mode: the user explicitly authorizes generated typography.${text?` Use this headline or brief as the starting point: “${text}”.`:""} Keep copy concise and compositionally necessary.`;
        }
        if(state.direction==="restore")special=" Restore means source-preserving Press Print treatment: keep more source structure and reduce destructive/material intervention; do not interpret this as archival restoration unless the user explicitly asks for that.";
        const locks=extras.length?` Preserve/lock: ${[...new Set(extras)].join("; ")}.`:"";
        const isAlternative=data.creationKind==="alternative";
        const lineage=isAlternative
          ?` This is a new alternative from the original source image. ${data.seedVersionId?`Version ${data.seedVersionId} is a control-state seed only. `:""}Do not use the previous result image as visual source and do not overwrite it. The alternative is not a child revision of the seed.`
          :" This is a new root version from the original source image.";
        const modeMetadata=state.direction==="custom"?` Custom direction metadata: ${state.customDirection.trim()}.`:state.direction==="typography"?` Typography metadata: mode ${state.textMode}${state.headline.trim()?`, text/brief “${state.headline.trim()}”`:""}.`:"";
        return `Generate a Press Print reconstruction of the same active original source image. Direction: ${name} (${state.direction}). Structure: ${state.structure}/100, where 0 means preserve the original camera composition and 100 means rebuild the composition aggressively. Intensity: ${state.intensity}/100, where 0 means soft treatment and 100 means strong visible treatment.${special}${locks}${lineage} Use the Press Print visual grammar and preservation logic. Do not ask for the source image again. When showing result controls, retain version metadata for direction ${state.direction}, Structure ${state.structure}, Intensity ${state.intensity}.${modeMetadata}`;
      }

      function setBusy(busy){
        document.querySelectorAll("button,input").forEach((el)=>{el.disabled=busy||(el.id==="preserveText"&&state.direction==="typography"&&state.textMode!=="keep")});
        $("advanced").style.pointerEvents=busy?"none":"";
        $("advanced").style.opacity=busy?".6":"";
      }

      async function generate(){
        if(!validate())return;
        setBusy(true);$("status").textContent="Generating…";await save();
        try{
          if(!window.openai?.sendFollowUpMessage)throw new Error("Host messaging unavailable");
          await window.openai.sendFollowUpMessage({prompt:buildPrompt(),scrollToBottom:true});
          $("status").textContent="Sent";
        }catch(e){setBusy(false);$("status").textContent="Couldn’t continue. Use chat instead.";console.error(e)}
      }

      function render(next,initializeState=false){
        data=next||{};applyTheme();
        if(initializeState&&!userTouched)state=buildInitialState();
        const sourceText=data.recommendationReason||data.sourceSummary||"Choose a direction, set how much Press Print may rebuild, then generate.";
        $("source").textContent=sourceText;
        renderDirections();renderSpecial();renderValues();validate();
      }

      $("structure").oninput=(e)=>{touch();state.structure=bounded(e.target.value,state.structure);renderValues()};
      $("structure").onchange=save;
      $("intensity").oninput=(e)=>{touch();state.intensity=bounded(e.target.value,state.intensity);renderValues()};
      $("intensity").onchange=save;
      document.querySelectorAll('input[name="textMode"]').forEach((el)=>el.addEventListener("change",()=>{touch();state.textMode=el.value;renderSpecial();validate();save()}));
      $("headline").addEventListener("input",()=>{touch();state.headline=$("headline").value;validate()});
      $("headline").addEventListener("change",save);
      $("customDirection").addEventListener("input",()=>{touch();state.customDirection=$("customDirection").value;validate()});
      $("customDirection").addEventListener("change",save);
      $("preserveSubject").addEventListener("change",()=>{touch();state.preserveSubject=$("preserveSubject").checked;save()});
      $("preserveColors").addEventListener("change",()=>{touch();state.preserveColors=$("preserveColors").checked;save()});
      $("preserveText").addEventListener("change",()=>{touch();state.preserveText=$("preserveText").checked;save()});
      $("generate").onclick=generate;

      render(data,true);
      window.addEventListener("openai:set_globals",(event)=>{
        const g=event?.detail?.globals||{};
        if(g.toolOutput){const first=!hasToolOutput;hasToolOutput=true;render(g.toolOutput,first)}
        if(g.theme)applyTheme();
      });
    })();
  </script>
</body>
</html>
