<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{color-scheme:light dark;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;background:transparent;color:var(--pp-text,#151515)}
    .wrap{padding:2px 0 1px;max-width:720px}.summary{font-size:13px;line-height:1.45;margin:0;opacity:.82}.preserve{font-size:11px;line-height:1.4;opacity:.52;margin-top:5px}
    .actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.action{appearance:none;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer;min-height:34px}
    .action.primary{border:1px solid var(--pp-text,#151515);background:var(--pp-text,#151515);color:var(--pp-bg,#fff)}.action.secondary{border:1px solid var(--pp-border,rgba(0,0,0,.14));background:transparent;color:inherit}.action:disabled{opacity:.42;cursor:default}
    .status{font-size:11px;opacity:.52;margin-top:7px;min-height:15px}
    @media(prefers-color-scheme:dark){body{--pp-text:#f1eee8;--pp-bg:#151515;--pp-border:rgba(255,255,255,.15)}}
  </style>
</head>
<body>
  <main class="wrap" data-press-print-widget="result-actions">
    <p id="summary" class="summary"></p>
    <div id="preserve" class="preserve"></div>
    <div id="actions" class="actions"></div>
    <div id="status" class="status" aria-live="polite"></div>
  </main>
  <script>
    (()=>{
      let data=window.openai?.toolOutput||null;
      const $=(id)=>document.getElementById(id);
      function applyTheme(){const t=window.openai?.theme;if(t==="light"||t==="dark")document.documentElement.style.colorScheme=t}
      function locale(){return String(window.openai?.locale||navigator.language||"en").toLowerCase()}
      function labels(){const zh=locale().startsWith("zh");return zh?{keeping:"继续保留",sending:"正在继续…",sent:"已发送",failed:"发送失败，可直接在聊天中继续修改。"}:{keeping:"Keeping",sending:"Continuing…",sent:"Requested",failed:"Couldn’t send. Ask in chat."}}
      function setDisabled(disabled){document.querySelectorAll(".action").forEach((b)=>{b.disabled=disabled})}
      async function send(a){
        const l=labels();$("status").textContent=l.sending;setDisabled(true);
        try{
          if(window.openai?.setWidgetState){await window.openai.setWidgetState({lastAction:a.id,lastActionLabel:a.label})}
          if(!window.openai?.sendFollowUpMessage)throw new Error("Host messaging unavailable");
          await window.openai.sendFollowUpMessage({prompt:a.prompt,scrollToBottom:true});
          $("status").textContent=l.sent;
        }catch(e){$("status").textContent=l.failed;setDisabled(false);console.error(e)}
      }
      function render(next){
        if(!next||!Array.isArray(next.actions))return;data=next;applyTheme();const l=labels();
        $("summary").textContent=next.resultSummary||"Keep what works and change one clear axis.";
        const notes=Array.isArray(next.preserveNotes)?next.preserveNotes.filter(Boolean):[];
        $("preserve").textContent=notes.length?`${l.keeping}: ${notes.join(" · ")}`:"";
        const box=$("actions");box.innerHTML="";$("status").textContent="";
        next.actions.slice(0,2).forEach((a,i)=>{const b=document.createElement("button");b.type="button";b.className=`action ${a.emphasis==="primary"||i===0?"primary":"secondary"}`;b.textContent=a.label;b.onclick=()=>send(a);box.appendChild(b)});
      }
      render(data);
      window.addEventListener("openai:set_globals",(event)=>{const g=event?.detail?.globals||{};if(g.toolOutput)render(g.toolOutput);if(g.theme||g.locale){applyTheme();if(data)render(data)}});
    })();
  </script>
</body>
</html>
